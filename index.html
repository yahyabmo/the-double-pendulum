<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Chaos Lab — Double Pendulum</title>
    <meta name="description" content="A real-time, interactive double pendulum simulator. Drag, fling, rewind and watch chaos unfold." />
    <meta name="theme-color" content="#05070d" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%2305070d'/><path d='M16 6 L10 16 L20 25' stroke='%23e2e8f0' stroke-width='2' fill='none' stroke-linecap='round'/><circle cx='10' cy='16' r='3.2' fill='%237dd3fc'/><circle cx='20' cy='25' r='3.6' fill='%23f472b6'/></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  </head>
  <body>
    <canvas id="stage" aria-label="Double pendulum simulation. Drag a bob to set its position."></canvas>

    <header class="topbar" id="topbar">
      <div class="brand">
        <svg viewBox="0 0 32 32" width="26" height="26" aria-hidden="true">
          <path d="M16 5 L9.5 15.5 L20 25.5" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" />
          <circle cx="9.5" cy="15.5" r="3.4" fill="#7dd3fc" />
          <circle cx="20" cy="25.5" r="3.8" fill="#f472b6" />
        </svg>
        <div>
          <div class="brand-name">Chaos Lab</div>
          <div class="brand-sub">double pendulum</div>
        </div>
      </div>

      <div class="transport" role="toolbar" aria-label="Playback">
        <button class="icon-btn" id="btn-reset" title="Reset to start (R)" aria-label="Reset">
          <svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.4-5.7" /><path d="M4 4v4h4" /></svg>
        </button>
        <button class="icon-btn" id="btn-rewind" title="Hold to rewind (← or hold)" aria-label="Rewind (hold)">
          <svg viewBox="0 0 24 24"><path d="M11 6 4 12l7 6z" class="fill" /><path d="M20 6l-7 6 7 6z" class="fill" /></svg>
        </button>
        <button class="icon-btn primary" id="btn-play" title="Play / pause (Space)" aria-label="Play or pause">
          <svg viewBox="0 0 24 24" class="ico-pause"><rect x="6" y="5" width="4" height="14" rx="1" class="fill" /><rect x="14" y="5" width="4" height="14" rx="1" class="fill" /></svg>
          <svg viewBox="0 0 24 24" class="ico-play"><path d="M7 5v14l12-7z" class="fill" /></svg>
        </button>
        <button class="icon-btn" id="btn-step" title="Step forward (→)" aria-label="Step forward">
          <svg viewBox="0 0 24 24"><path d="M6 6l8 6-8 6z" class="fill" /><rect x="16" y="6" width="2.5" height="12" rx="1" class="fill" /></svg>
        </button>
        <div class="segmented" id="speed" role="radiogroup" aria-label="Simulation speed"></div>
      </div>

      <button class="icon-btn" id="btn-panel" title="Toggle controls (P)" aria-label="Toggle controls panel">
        <svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8" /><circle cx="16" cy="7" r="2" /><circle cx="10" cy="17" r="2" /></svg>
      </button>
    </header>

    <aside class="panel" id="panel" aria-label="Controls"></aside>

    <section class="hud" id="hud" aria-live="off"></section>

    <div class="hint" id="hint">
      <span><kbd>drag</kbd> a bob to place it · <kbd>fling</kbd> to throw it</span>
      <span class="hint-keys"><kbd>Space</kbd> play · hold <kbd>←</kbd> rewind · <kbd>1–6</kbd> presets</span>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
